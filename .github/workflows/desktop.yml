# Desktop installers for Linux, Windows and macOS (D26/D27, #mm59n2yq).
#
# - A `v*` tag builds all three and attaches the installers to a **draft**
#   GitHub Release; @lead publishes it after the release gate.
# - `ci/**` branches and manual runs build the same installers as workflow
#   artifacts only (no release), to test unmerged work.
# - Every build is checked: the Electron fuses must be hardened in the shipped
#   binary, and on Linux the desktop smoke tests run against the real app on a
#   virtual display.
# - The Linux .deb is installed for real and smoke-tested sandboxed, then
#   purged (#s96835xj, scripts/deb-smoke.sh).
# - Every installer is then inspected inside the build (#sj44x5ph,
#   scripts/inspect-installers.mjs): names, versions, Windows FileDescription,
#   .deb fields, fuses, app.asar contents, macOS signature, SHA-256. The job
#   summary shows the table, and the release job checks the uploaded files
#   against those checksums. Release gates no longer download installers to
#   check them; only the Linux hands-on test needs a download.
# Unsigned for now: Windows SmartScreen and macOS Gatekeeper will warn
# (signing/notarisation is a later task).
name: Desktop builds

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]
  workflow_dispatch:
    inputs:
      signing_dry_run:
        description: "Only run the update-signing dry run (a throwaway key made in the job; no build, nothing uploaded)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    if: ${{ !inputs.signing_dry_run }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage, deb)
            os: ubuntu-latest
            builder: --linux AppImage deb --x64
            artifacts: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/latest-linux.yml
              apps/desktop/release/SHA256SUMS-*.txt
          - name: Windows (installer)
            os: windows-latest
            builder: --win nsis --x64
            artifacts: |
              apps/desktop/release/*.exe
              apps/desktop/release/latest.yml
              apps/desktop/release/*.exe.blockmap
              apps/desktop/release/SHA256SUMS-*.txt
          - name: macOS (dmg, zip; Apple silicon and Intel)
            # One arm64 runner builds both architectures (no native modules).
            os: macos-latest
            builder: --mac dmg zip --arm64 --x64
            artifacts: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/latest-mac.yml
              apps/desktop/release/*.dmg.blockmap
              apps/desktop/release/*.zip.blockmap
              apps/desktop/release/SHA256SUMS-*.txt
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # #quax5vwn: a release tag builds (and drafts a release) only if every
      # version place says the tag's version. Before the install, so a wrong
      # version stops every OS's job at once.
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/set-version.mjs --check "${GITHUB_REF_NAME#v}"

      # D44: a release must carry the owner's two update-signing public keys;
      # with none, its auto-update would silently skip the signature check.
      - name: Update keys are built in
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-update-keys.mjs --require

      - name: Install dependencies
        run: npm ci

      - name: Version from the tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app (web + desktop main process)
        run: npm run build -w @gumply/desktop

      - name: Desktop smoke tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus
          node apps/desktop/scripts/test.mjs

      - name: Package installers
        working-directory: apps/desktop
        shell: bash
        env:
          # Never sign or publish from here; the release job attaches files.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.builder }} --publish never -c.extraMetadata.version=${{ steps.version.outputs.version }}

      - name: Check Electron fuses in the shipped app
        working-directory: apps/desktop
        run: node scripts/check-fuses.mjs --release release

      # What the release gate used to check by hand after downloading ~700 MB
      # (#sj44x5ph): file and app names, the version stamped everywhere,
      # Windows FileDescription, .deb control fields and md5sums, fuses of the
      # binary inside each installer, app.asar (no node_modules, source maps or
      # secrets), the macOS signature. Writes SHA256SUMS-<os>.txt and a table to
      # the job summary; fails the job on any mismatch.
      - name: Inspect the installers
        working-directory: apps/desktop
        shell: bash
        run: node scripts/inspect-installers.mjs --release release --version "${{ steps.version.outputs.version }}"

      # Proves the inspector can fail: a real installer under another
      # version's name must be rejected by the version stamped inside it.
      - name: Inspector self-test (a mislabelled installer is rejected)
        working-directory: apps/desktop
        shell: bash
        run: node scripts/inspect-installers.mjs --release release --version "${{ steps.version.outputs.version }}" --self-test

      # #s96835xj: install the .deb for real and check it runs sandboxed on a
      # stock Ubuntu 23.10+ setting (unprivileged user namespaces restricted
      # by AppArmor): the profile is installed and loaded, the GUI and the
      # `--mcp` snippet start without --no-sandbox, a copy outside /opt/Gumply
      # aborts (the control), and purge removes the profile. It needs sudo,
      # which the swarm server doesn't have, so it lives here.
      - name: Install the .deb and smoke-test it sandboxed (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        env:
          DEB_SMOKE_LOGS: ${{ github.workspace }}/test-results/deb-smoke
        run: bash scripts/deb-smoke.sh release

      # #429bvzwr: the installed app as a user gets it, on every OS
      # (apps/desktop/e2e/packaged.spec.ts): it starts on a vault and reports
      # the version, the licences file is in its resources, PDF export prints
      # through the OS print backend, and the Claude Desktop snippet, written
      # into claude_desktop_config.json and started as Claude Desktop starts it,
      # serves the vault while the app is open. Real Claude Desktop (sign-in)
      # stays an optional owner spot-check.
      - name: Install the packaged app (Windows, NSIS per user)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'Gumply-Setup-*-x64.exe' | Select-Object -First 1
          $process = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The installer exited with $($process.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Gumply\Gumply.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Depth 1 | Out-Host; throw "Not installed at $exe" }
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object DisplayName -like 'Gumply*' | Select-Object -First 1
          "GUMPLY_PACKAGED_APP=$exe" >> $env:GITHUB_ENV
          "| OS | Check | Result |`n|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| win32 | installed ($($setup.Name) /S, per user) | $exe; uninstall entry: $($entry.DisplayName) $($entry.DisplayVersion) |" >> $env:GITHUB_STEP_SUMMARY

      - name: Install the packaged app (macOS, the arm64 .dmg into ~/Applications)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls release/Gumply-*-arm64.dmg | head -1)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          mkdir -p "$HOME/Applications"
          ditto "$mount/Gumply.app" "$HOME/Applications/Gumply.app"
          hdiutil detach "$mount"
          app="$HOME/Applications/Gumply.app/Contents/MacOS/Gumply"
          test -x "$app"
          quarantine=$(xattr -p com.apple.quarantine "$HOME/Applications/Gumply.app" 2>/dev/null || echo none)
          echo "GUMPLY_PACKAGED_APP=$app" >> "$GITHUB_ENV"
          { echo "| OS | Check | Result |"; echo "|---|---|---|"
            echo "| darwin | installed ($(basename "$dmg") → ~/Applications) | $app; quarantine: $quarantine (Gatekeeper not exercised) |"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the packaged app (Linux, the AppImage)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          # The AppImage's static runtime mounts itself with fusermount (no libfuse2).
          command -v fusermount3 >/dev/null || command -v fusermount >/dev/null || sudo apt-get install -y fuse3
          app=$(ls "$PWD"/release/Gumply-*-x86_64.AppImage | head -1)
          chmod +x "$app"
          echo "GUMPLY_PACKAGED_APP=$app" >> "$GITHUB_ENV"
          { echo "| OS | Check | Result |"; echo "|---|---|---|"
            echo "| linux | AppImage | $app; userns restricted: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a) (AppRun adds --no-sandbox when 1) |"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the installed app (packaged.spec)
        shell: bash
        env:
          GUMPLY_PACKAGED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Linux: the virtual display and private D-Bus of the smoke tests above.
          if [[ "$RUNNER_OS" == Linux ]]; then node apps/desktop/scripts/test.mjs packaged.spec.ts
          else npx playwright test --config apps/desktop/e2e/playwright.config.ts packaged.spec.ts; fi

      - name: Uninstall the packaged app (Windows)
        if: always() && runner.os == 'Windows' && env.GUMPLY_PACKAGED_APP != ''
        shell: pwsh
        run: |
          $dir = Split-Path $env:GUMPLY_PACKAGED_APP
          & (Join-Path $dir 'Uninstall Gumply.exe') /S
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $env:GUMPLY_PACKAGED_APP) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 1 }
          if (Test-Path $env:GUMPLY_PACKAGED_APP) { throw "Still installed 60 s after the uninstaller ran" }
          "| win32 | uninstall (/S) | $dir removed |" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: gumply-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

      # spec/auto-update §8 (#a7qepp99): an update from N to N+1 with no GitHub
      # release. Test builds of N and N+1 (GUMPLY_BUILD_TEST_FEED=1 keeps the
      # 127.0.0.1 feed switch, which the release artifacts above never have),
      # after those are uploaded; apps/desktop/e2e/update.spec.ts serves N+1
      # from a local feed. macOS and the .deb only get a notice (no install).
      - name: Build the update test (N and N+1 with the test feed)
        if: runner.os != 'macOS'
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          old="${{ steps.version.outputs.version }}"
          new=$(node -p 'const [a, b, c] = process.argv[1].split("-")[0].split(".").map(Number); [a, b, c + 1].join(".")' "$old")
          GUMPLY_BUILD_TEST_FEED=1 GUMPLY_DESKTOP_SKIP_WEB=1 node scripts/build.mjs
          if [[ "$RUNNER_OS" == Windows ]]; then target=(--win nsis --x64); else target=(--linux AppImage --x64); fi
          npx electron-builder "${target[@]}" --publish never -c.extraMetadata.version="$old" -c.directories.output=update-test/old
          npx electron-builder "${target[@]}" --publish never -c.extraMetadata.version="$new" -c.directories.output=update-test/new
          # One of the two patterns never matches on a given OS: nullglob, not ls (exit 2 under pipefail).
          shopt -s nullglob
          found=(update-test/old/*.AppImage update-test/old/Gumply-Setup-*.exe)
          oldfile="${found[0]}"
          abs() { node -p 'require("node:path").resolve(process.argv[1])' "$1"; }
          { echo "GUMPLY_UPDATE_OLD=$(abs "$oldfile")"; echo "GUMPLY_UPDATE_OLD_VERSION=$old"
            echo "GUMPLY_UPDATE_FEED_DIR=$(abs update-test/new)"; echo "GUMPLY_UPDATE_NEW_VERSION=$new"; } >> "$GITHUB_ENV"

      - name: Update from N to N+1 (update.spec)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then node apps/desktop/scripts/test.mjs update.spec.ts
          else npx playwright test --config apps/desktop/e2e/playwright.config.ts update.spec.ts; fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results-${{ runner.os }}
          path: |
            test-results/desktop
            test-results/deb-smoke
          if-no-files-found: ignore

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # D44: the signing key is a secret of the protected "release" environment.
    # If the owner set required reviewers there, this job waits for their
    # approval before anything is signed or uploaded.
    environment: release
    permissions:
      contents: write
    steps:
      # The signing scripts (Node built-ins only; no npm ci).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: gumply-*
          path: dist
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          GUMPLY_SIGNING_KEY: ${{ secrets.GUMPLY_SIGNING_KEY }}
        run: |
          ls -la dist
          cd dist
          # Each build job wrote SHA256SUMS-<os>.txt for the installers it
          # inspected: the downloaded files must be exactly those, unchanged.
          cat SHA256SUMS-*.txt | sort -k2 > ../inspected-sums.txt
          rm SHA256SUMS-*.txt
          sha256sum -c ../inspected-sums.txt
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          if ! diff <(sort -k2 SHA256SUMS.txt) ../inspected-sums.txt; then
            echo "::error::release assets differ from the inspected installers"
            exit 1
          fi
          { echo "### Release assets"; echo; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cd ..
          # D44: sign the sums (the key never leaves the env var, and the script
          # never prints it), then check the .sig exactly as the app will, with
          # the keys built into this release. dist/* then uploads the .sig too.
          bash scripts/sign-release.sh dist
          # A tag with a suffix (v0.5.0-rc.1, -beta…) is a pre-release.
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft "${prerelease[@]}" --verify-tag \
              --title "Gumply $TAG" \
              --notes "Desktop installers for $TAG (unsigned: Windows SmartScreen and macOS Gatekeeper will warn). Checksums in SHA256SUMS.txt; SHA256SUMS.txt.sig is Gumply's update signature over them, checked by the app before it installs an update."
          fi

  # D44: proves the release job's signing path before a tag, by hand only
  # (Run workflow → signing_dry_run). The same scripts/sign-release.sh, with a
  # THROWAWAY key pair made by gen-update-keys.mjs in this job and checked
  # against those throwaway public keys (never the built-in ones). No
  # "release" environment, no secret, no build, nothing uploaded.
  signing-dry-run:
    name: Update signing dry run
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Sign and verify with a throwaway key
        run: |
          keys="$RUNNER_TEMP/throwaway-keys"
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          # Stand-in release files, summed as the release job sums them.
          printf 'installer\n' > "$dist/Gumply-0.0.0-x86_64.AppImage"
          printf 'installer\n' > "$dist/Gumply-Setup-0.0.0-x64.exe"
          (cd "$dist" && sha256sum * > SHA256SUMS.txt)
          # The owner's script, on a clean runner; its public lines become a stand-in update-keys.ts.
          node scripts/gen-update-keys.mjs "$keys" > "$RUNNER_TEMP/gen.txt"
          { echo 'export const UPDATE_PUBLIC_KEYS: readonly UpdatePublicKey[] = ['
            grep -E '^\s*\{ id: "[0-9a-f]{16}", spki: ' "$RUNNER_TEMP/gen.txt"
            echo '];'; } > "$RUNNER_TEMP/update-keys.ts"
          node scripts/check-update-keys.mjs --require --keys-file "$RUNNER_TEMP/update-keys.ts"
          GUMPLY_SIGNING_KEY="$(cat "$keys/gumply-update-primary.pem")" bash scripts/sign-release.sh "$dist" --keys-file "$RUNNER_TEMP/update-keys.ts"
          # Without the secret, the release path refuses.
          if GUMPLY_SIGNING_KEY= bash scripts/sign-release.sh "$dist" >/dev/null 2>&1; then echo "::error::signed without a key"; exit 1; fi
          # And the real built-in list (empty until the owner's keys are in) is what a tag would check.
          node scripts/check-update-keys.mjs --require 2>/dev/null || echo "::warning::the built-in update keys aren't in yet: a v* tag would stop here."
          rm -rf "$keys"
