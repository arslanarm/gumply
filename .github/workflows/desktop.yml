# Desktop installers for Linux, Windows and macOS (D26/D27, #mm59n2yq).
#
# - A `v*` tag builds all three and attaches the installers to a **draft**
#   GitHub Release; @lead publishes it after the release gate.
# - `ci/**` branches and manual runs build the same installers as workflow
#   artifacts only (no release), to test unmerged work.
# - Every build is checked: the Electron fuses must be hardened in the shipped
#   binary, and on Linux the desktop smoke tests run against the real app on a
#   virtual display.
# Unsigned for now: Windows SmartScreen and macOS Gatekeeper will warn
# (signing/notarisation is a later task).
name: Desktop builds

on:
  push:
    tags: ["v*"]
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage, deb)
            os: ubuntu-latest
            builder: --linux AppImage deb --x64
            artifacts: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
          - name: Windows (installer)
            os: windows-latest
            builder: --win nsis --x64
            artifacts: |
              apps/desktop/release/*.exe
          - name: macOS (dmg, zip; Apple silicon and Intel)
            # One arm64 runner builds both architectures (no native modules).
            os: macos-latest
            builder: --mac dmg zip --arm64 --x64
            artifacts: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version from the tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app (web + desktop main process)
        run: npm run build -w @gumply/desktop

      - name: Desktop smoke tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus
          node apps/desktop/scripts/test.mjs

      - name: Package installers
        working-directory: apps/desktop
        shell: bash
        env:
          # Never sign or publish from here; the release job attaches files.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.builder }} --publish never -c.extraMetadata.version=${{ steps.version.outputs.version }}

      - name: Check Electron fuses in the shipped app
        working-directory: apps/desktop
        run: node scripts/check-fuses.mjs --release release

      - uses: actions/upload-artifact@v7
        with:
          name: gumply-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results on failure
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results
          path: test-results/desktop
          if-no-files-found: ignore

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gumply-*
          path: dist
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          # A tag with a suffix (v0.5.0-rc.1, -beta…) is a pre-release.
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft "${prerelease[@]}" --verify-tag \
              --title "Gumply $TAG" \
              --notes "Desktop installers for $TAG (unsigned: Windows SmartScreen and macOS Gatekeeper will warn). Checksums in SHA256SUMS.txt."
          fi
