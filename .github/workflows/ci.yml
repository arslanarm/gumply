# CI (#rzpnittv): typecheck, unit tests, build and the full Playwright e2e suite.
# Runs on every push to main, to ci/** (how unmerged work gets a real run) and on
# release tags, plus by hand. A newer run on the same ref cancels an older one.
name: CI

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Typecheck, unit tests and build on both supported LTS lines. Node 22 stays in
  # the matrix so the vault-watcher regression test (#3ugdxhzu: Node 20/22's
  # recursive fs.watch loses atomically replaced files) keeps running there.
  checks:
    name: checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The full browser suite on the Node in .nvmrc (24 LTS).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Cache the browsers by Playwright version; system deps are installed
      # every run (they live outside the cache).
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox

      # The suite builds core itself and starts its own app on its own ports
      # with a fresh temp vault per run (e2e/support/env.ts).
      - name: E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
